[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodriver-turnstile"
version = "0.1.0"
description = "Solve Cloudflare Turnstile inside a nodriver browser."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CircuitSavage" }]
keywords = [
    "nodriver", "cloudflare", "turnstile", "captcha", "solver",
    "bot", "automation", "scraping", "bypass",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/CircuitSavage/nodriver-turnstile"
Solver = "https://peak.fo/?utm_source=pypi&utm_medium=readme&utm_campaign=packages&utm_content=nodriver-turnstile"

[tool.hatch.build.targets.wheel]
packages = ["nodriver_turnstile"]
